    data_type: [number]
    unit: probability
    authorability: compatibility_only
    allowed_values: null
    constraints: {minimum: 0, exclusive_maximum: 1}
    derived_from: []
    conflict_policy: reject
    selector_use: true
    engine_use: true
    status: misplaced_legacy
    canonical_location: /values/treatment_censoring_probability
    compatibility_locations: [/study/treatment_censoring_probability]
    notes: []

values_namespace:
  definition_source: references/procedure_catalog.yaml#procedures[*].input_contracts
  duplication_policy: Procedure-specific value definitions remain in the procedure catalog; this file defines only shared cross-procedure semantics.
  validation_order:
    - validate common fields before selection
    - bind a procedure
    - validate procedure-specific fields against the selected procedure input_contracts
    - reject unused or unknown values unless an explicit composition contract consumes them
  common_fields:
    alpha:
      owner: StudySpec
      path: /values/alpha
      kind: study_value
      data_type: [number]
      unit: probability
      authorability: user_or_inferred
      allowed_values: null
      constraints: {exclusive_minimum: 0, exclusive_maximum: 1}
      derived_from: [/values/confidence_level]
      conflict_policy: reject
      selector_use: true
      engine_use: true
      status: canonical
      canonical_location: /values/alpha
      compatibility_locations: []
      notes: [A policy default must carry its policy identifier in provenance.]
    target_power:
      owner: StudySpec
      path: /values/target_power
      kind: study_value
      data_type: [number]
      unit: probability
      authorability: user_or_inferred
      allowed_values: null
      constraints: {exclusive_minimum: 0, exclusive_maximum: 1}
      derived_from: [/values/beta]
      conflict_policy: reject
      selector_use: true
      engine_use: true
      status: canonical
      canonical_location: /values/target_power
      compatibility_locations: []
      notes: [Not applicable to achieved-power, precision-only, or other non-power requests.]
    sidedness:
      owner: StudySpec
      path: /values/sidedness
      kind: study_value
      data_type: [integer, string]
      unit: side
      authorability: user_or_inferred
      allowed_values: [1, 2, one_sided, two_sided]
      constraints: {}
      derived_from: [/study/directionality]
      conflict_policy: reject
      selector_use: true
      engine_use: true
      status: canonical_transitional
      canonical_location: /values/sidedness
      compatibility_locations: []
      notes: [The target canonical representation is integer 1 or 2; strings remain readable during migration.]
    allocation:
      owner: StudySpec
      path: /values/allocation
      kind: study_value
      data_type: [number, object]
      unit: ratio_or_counts
      authorability: user_or_inferred
      allowed_values: null
      constraints: {number_exclusive_minimum: 0}
      derived_from: []
      conflict_policy: reject
      selector_use: true
      engine_use: true
      status: canonical
      canonical_location: /values/allocation
      compatibility_locations: []
      notes: [Structured allocation must name group direction; a bare non-1 ratio may require clarification.]
    confidence_level:
      owner: StudySpec
      path: /values/confidence_level
      kind: study_value
      data_type: [number]
      unit: probability
      authorability: user_or_inferred
      allowed_values: null
      constraints: {exclusive_minimum: 0, exclusive_maximum: 1}
      derived_from: []
      conflict_policy: reject
      selector_use: true
      engine_use: true
      status: canonical
      canonical_location: /values/confidence_level
      compatibility_locations: [/study/confidence_level]
      notes: []
    margin:
      owner: StudySpec
      path: /values/margin
      kind: study_value
      data_type: [number, object]
      unit: method_specific
      authorability: user_or_inferred
      allowed_values: null
      constraints: {}
      derived_from: []
      conflict_policy: reject
      selector_use: true
      engine_use: true
      status: canonical
      canonical_location: /values/margin
      compatibility_locations: [/study/margin]
      notes: []
    censoring_probability:
      owner: StudySpec
      path: /values/censoring_probability
      kind: study_value
      data_type: [number]
      unit: probability
      authorability: user_or_inferred
      allowed_values: null
      constraints: {minimum: 0, exclusive_maximum: 1}
      derived_from: []
      conflict_policy: reject
      selector_use: true
      engine_use: true
      status: canonical
      canonical_location: /values/censoring_probability
      compatibility_locations: [/study/censoring_probability]
      notes: []
    standard_censoring_probability:
      owner: StudySpec
      path: /values/standard_censoring_probability
      kind: study_value
      data_type: [number]
      unit: probability
      authorability: user_or_inferred
      allowed_values: null
      constraints: {minimum: 0, exclusive_maximum: 1}
      derived_from: []
      conflict_policy: reject
      selector_use: true
      engine_use: true
      status: canonical
      canonical_location: /values/standard_censoring_probability
      compatibility_locations: [/study/standard_censoring_probability]
      notes: []
    treatment_censoring_probability:
      owner: StudySpec
      path: /values/treatment_censoring_probability
      kind: study_value
      data_type: [number]
      unit: probability
      authorability: user_or_inferred
      allowed_values: null
      constraints: {minimum: 0, exclusive_maximum: 1}
      derived_from: []
      conflict_policy: reject
      selector_use: true
      engine_use: true
      status: canonical
      canonical_location: /values/treatment_censoring_probability
      compatibility_locations: [/study/treatment_censoring_probability]
      notes: []

semantic_rules:
  - code: OUTCOME_TYPE_ALIAS_NORMALIZED
    severity: normalization
    when: {path: /study/outcome_type, value_in: [time-to-event, survival, rate, repeated_continuous, procedure-specific]}
    assert: {replace_from_field_normalization_aliases: outcome_type}
    message: Normalize known outcome aliases before selection without changing procedure identifiers.
  - code: OUTCOME_CODE_CONFLICT
    severity: error
    when: {path_present: /study/outcome_code, procedure_bound: true}
    assert: {equals_selected_catalog_field: outcome_code}
    message: A supplied outcome_code must agree with the selected catalog procedure.
  - code: DESIGN_CLUSTER_CONFLICT
    severity: error
    when: {paths_present: [/study/design_type, /study/clustered]}
    assert: {field_agrees_with_design_projection: clustered}
    message: clustered must agree with the canonical design_type projection.
  - code: DESIGN_REPEATED_CONFLICT
    severity: error
    when: {paths_present: [/study/design_type, /study/repeated_measures]}
    assert: {field_agrees_with_design_projection: repeated_measures}
    message: repeated_measures must agree with the canonical design_type projection.
  - code: DESIGN_PAIRING_CONFLICT
    severity: error
    when: {paths_present: [/study/design_type, /study/paired_or_independent], design_projection_unambiguous: true}
    assert: {field_agrees_with_design_projection: paired_or_independent}
    message: paired_or_independent must agree with design_type when the projection is unambiguous.
  - code: MISPLACED_STUDY_VALUE
    severity: normalization
    when: {path_in: [/study/margin, /study/confidence_level, /study/censoring_probability, /study/standard_censoring_probability, /study/treatment_censoring_probability]}
    assert: {move_to_declared_canonical_location: true, preserve_provenance: imported_legacy}
    message: Read the legacy study location and write the value at its canonical /values location.
  - code: DUPLICATE_LOCATION_CONFLICT
    severity: error
    when: {canonical_and_compatibility_locations_present: true}
    assert: {values_equivalent: true}
    message: Canonical and compatibility locations must not contain different values.
  - code: ANALYSIS_METHOD_BINDING_CONFLICT
    severity: error
    when: {path_present: /study/analysis_method, procedure_bound: true}
    assert: {compatible_with_selected_procedure: true}
    message: A requested analysis method must be compatible with the selected procedure.
  - code: PROCEDURE_VALUE_UNKNOWN
    severity: error
    when: {procedure_bound: true, value_not_in_selected_input_contracts_or_common_fields: true}
    assert: {explicit_composition_consumer_exists: true}
    message: A bound request must not silently ignore unknown values.

