  censoring_probability:
    owner: StudySpec
    path: /study/censoring_probability
    kind: study_value
    data_type: [number]
    unit: probability
    authorability: compatibility_only
    allowed_values: null
    constraints: {minimum: 0, exclusive_maximum: 1}
    derived_from: []
    conflict_policy: reject
    selector_use: true
    engine_use: true
    status: misplaced_legacy
    canonical_location: /values/censoring_probability
    compatibility_locations: [/study/censoring_probability]
    notes: []
  standard_censoring_probability:
    owner: StudySpec
    path: /study/standard_censoring_probability
    kind: study_value
    data_type: [number]
    unit: probability
    authorability: compatibility_only
    allowed_values: null
    constraints: {minimum: 0, exclusive_maximum: 1}
    derived_from: []
    conflict_policy: reject
    selector_use: true
    engine_use: true
    status: misplaced_legacy
    canonical_location: /values/standard_censoring_probability
    compatibility_locations: [/study/standard_censoring_probability]
