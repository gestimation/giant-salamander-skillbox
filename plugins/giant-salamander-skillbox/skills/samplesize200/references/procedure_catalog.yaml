- procedure_key: ss200-proc-3aae05b533fd149a
  public_id: ONE-S-001
  engine_id: ONE-S-001.SAMPLE_SIZE
  legacy_ids:
  - ONE-S-001
  - ONE-S-001.N
  title_ja: 1群Kaplan-Meier生存確率：逆正弦平方根変換
  title_en: One-sample Kaplan-Meier survival probability, arcsine square-root transformation
  family: ONE
  operation: SAMPLE_SIZE
  outcome_type: time_to_event
  outcome_code: S
  design: one_sample_survival_probability
  hypothesis_objective: superiority_hypothesis_test
  effect_measure: arcsine_square_root_survival_difference
  required_inputs:
  - analysis_time
  - null_survival_probability
  - alternative_survival_probability
  - accrual_time
  - followup_time
  optional_inputs:
  - name: alpha
    default: 0.05
  - name: power
    default: 0.8
  - name: sides
    default: 1
  - name: attrition_rate
    default: 0.0
  input_contracts:
  - name: analysis_time
    data_type: number
    required: true
    default: null
    unit: study_time_unit
    role: endpoint
    allowed_range:
      minimum_exclusive: 0
    source: Nagashima et al. (2021), equation (2) and uniform-accrual setting
  - name: null_survival_probability
    data_type: number
    required: true
    default: null
    unit: dimensionless
    role: reference
    allowed_range:
      minimum_exclusive: 0
      maximum_exclusive: 1
    source: Nagashima et al. (2021), equation (2)
  - name: alternative_survival_probability
    data_type: number
    required: true
    default: null
    unit: dimensionless
    role: treatment_or_planned
    allowed_range:
      minimum_exclusive: 0
      maximum_exclusive: 1
    source: Nagashima et al. (2021), equation (2)
  - name: accrual_time
    data_type: number
    required: true
    default: null
    unit: study_time_unit
    role: design
    allowed_range:
      minimum_inclusive: 0
    source: Nagashima et al. (2021), Section 2.4
  - name: followup_time
    data_type: number
    required: true
    default: null
    unit: study_time_unit
    role: design
    allowed_range:
      minimum_inclusive: 0
    source: Nagashima et al. (2021), Section 2.4
  - name: alpha
    data_type: number
    required: false
    default: 0.05
    unit: dimensionless
    role: hypothesis
    allowed_range:
      minimum_exclusive: 0
      maximum_exclusive: 1
    source: Nagashima et al. (2021), equation (2)
  - name: power
    data_type: number
    required: false
    default: 0.8
    unit: dimensionless
    role: hypothesis
    allowed_range:
      minimum_exclusive: 0
      maximum_exclusive: 1
    source: Nagashima et al. (2021), equation (2)
  - name: sides
    data_type: integer
    required: false
    default: 1
    unit: dimensionless
    role: hypothesis
    allowed_range:
      enum:
      - 1
      - 2
    source: Author calculator and implementation contract
  - name: attrition_rate
    data_type: number
    required: false
    default: 0.0
    unit: dimensionless
    role: attrition
    allowed_range:
      minimum_inclusive: 0
      maximum_exclusive: 1
    source: Engine finalization contract
  explicit_confirmation_inputs:
  - alpha
  - power
  - sides
  primary_output:
    quantity: participants
    unit: person
    stage: final
  secondary_outputs:
  - raw participants
  - rounded participants
