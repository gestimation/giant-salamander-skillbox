curated_count: 51
guidance:
- procedure_key: ss200-proc-3aae05b533fd149a
  use_when:
  - A single cohort is planned and the primary hypothesis concerns its Kaplan-Meier
    survival probability at one fixed analysis time versus a prespecified value.
  do_not_use_when:
  - The primary question compares two survival curves or hazards.
  - Exponential survival and uniform accrual are not defensible and no sensitivity
    analysis is planned.
  required_questions:
  - What are the null and planned survival probabilities at the analysis time?
  - What are the accrual duration and minimum follow-up duration, in the same time
    unit?
  - Is the test one-sided or two-sided?
  recommended_questions:
  - Is an attrition allowance required after the model-based sample size?
  assumptions:
  - Exponential survival
  - Uniform accrual
  - Pointwise Kaplan-Meier normal approximation after arcsine square-root transformation
  competing_procedures:
  - TWO-S-001
  - TWO-S-002
  selection_differences:
  - ONE-S-001 tests one cohort against a fixed survival probability; TWO-S methods
    compare groups using hazard-ratio models.
  sensitivity_parameters:
  - alternative_survival_probability
  - accrual_time
  - followup_time
  - attrition_rate
  common_misuses:
  - Treating a hazard ratio as though it were a pointwise survival probability.
  - Mixing time units across analysis, accrual, and follow-up durations.
  review_checks:
  - Confirm that the analysis time is before the end of accrual plus follow-up when
    type-I censoring is present.
  - Confirm the direction and clinical basis of the null and planned survival probabilities.
  explanation_points:
  - The transformation stabilizes the pointwise survival-probability variance when
    censoring is absent.
  - Administrative censoring is incorporated through the Kaplan-Meier asymptotic variance
    integral.
  guidance_status: HUMAN_REVIEWED_FOR_0_1_2
