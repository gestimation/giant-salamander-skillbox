    unit: event
    stage: final
    completion_rule: Stop after the event kernel; participant conversion is an optional next step.
    procedures:
      TWO-S-001:
        engine_method_id: TWO-017
        required_inputs: [hazard_ratio]
        optional_inputs:
        - {name: allocation_ratio, default: 1.0}
        - {name: alpha, default: 0.05}
        - {name: power, default: 0.8}
        - {name: sides, default: 2}
      TWO-S-002:
        engine_method_id: TWO-018
        required_inputs: [hazard_ratio]
        optional_inputs:
        - {name: allocation_ratio, default: 1.0}
        - {name: alpha, default: 0.05}
        - {name: power, default: 0.8}
        - {name: sides, default: 2}
  required_sample_size:
    quantity: procedure_specific_final_research_size
    stage: final
    completion_rule: Use the ordinary validated end-to-end public procedure contract.
  attrition_adjusted_sample_size:
    quantity: participants
    unit: person
    stage: final
    completion_rule: Require only an attrition field already supported by the selected validated procedure.
    procedures:
      ONE-S-001: [attrition_rate]
      TWO-B-001: [individual_attrition_rate, cluster_attrition_rate]
      TWO-B-008: [individual_attrition, cluster_attrition]
      TWO-B-009: [individual_attrition, cluster_attrition]
      TWO-C-001: [individual_attrition_rate, cluster_attrition_rate]
      TWO-C-012: [individual_attrition, cluster_attrition]
      TWO-C-013: [individual_attrition, cluster_attrition]
      TWO-C-014: [individual_attrition, cluster_attrition]
      TWO-C-015: [individual_attrition, cluster_attrition]
      TWO-O-008: [individual_attrition, cluster_attrition]
      TWO-R-005: [individual_attrition, cluster_attrition]
      TWO-S-006: [individual_attrition, cluster_attrition]
